<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expenses – Personal Expense Analysis and Prediction System</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="stylesheet" href="../vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- App Shell (Sidebar & Topbar) -->
    <div id="appShell"></div>

    <!-- Main Content Area -->
    <main class="main-area">
      <div class="page-content">
        <!-- Action Header -->
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
          <div id="expensesSummary" class="text-muted-sw small">
            Loading transaction summary…
          </div>
          <div class="d-flex align-items-center gap-2">
            <button class="btn btn-outline-sw btn-sm" id="exportCsvBtn">
              <i data-lucide="download" style="width: 15px; height: 15px;"></i> Export CSV
            </button>
            <button class="btn btn-primary btn-sm" id="openAddExpenseBtn">
              <i data-lucide="plus" style="width: 15px; height: 15px;"></i> Add Expense
            </button>
          </div>
        </div>

        <!-- Filters Card -->
        <div class="card-sw card-body-sw mb-4">
          <div class="row g-2 align-items-center">
            <!-- Search -->
            <div class="col-md-3">
              <input type="text" class="form-control form-control-sm" id="filterSearch" placeholder="Search by title or notes…" />
            </div>
            <!-- Category Filter -->
            <div class="col-sm-6 col-md-2">
              <select class="form-select form-select-sm" id="filterCategory">
                <option value="">All Categories</option>
              </select>
            </div>
            <!-- Payment Method Filter -->
            <div class="col-sm-6 col-md-2">
              <select class="form-select form-select-sm" id="filterPaymentMethod">
                <option value="">All Payment Methods</option>
                <option value="Cash">Cash</option>
                <option value="UPI">UPI</option>
                <option value="Debit Card">Debit Card</option>
                <option value="Credit Card">Credit Card</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <!-- Date Range -->
            <div class="col-sm-6 col-md-2">
              <input type="date" class="form-control form-control-sm" id="filterStartDate" title="Start date" />
            </div>
            <div class="col-sm-6 col-md-2">
              <input type="date" class="form-control form-control-sm" id="filterEndDate" title="End date" />
            </div>
            <!-- Clear Filters -->
            <div class="col-md-1 text-md-end">
              <button class="btn btn-outline-sw btn-sm w-100" id="clearFiltersBtn" title="Reset all filters">
                Clear
              </button>
            </div>
          </div>
        </div>

        <!-- Expenses Table Card -->
        <div class="card-sw p-0 mb-4">
          <div class="table-responsive">
            <table class="table table-sw align-middle mb-0">
              <thead>
                <tr>
                  <th class="ps-3">Date</th>
                  <th>Title & Notes</th>
                  <th>Category</th>
                  <th>Payment Method</th>
                  <th>Amount</th>
                  <th class="text-end pe-3">Actions</th>
                </tr>
              </thead>
              <tbody id="expensesTableBody">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
          <div class="d-flex justify-content-between align-items-center p-3 border-top" id="paginationControls">
            <!-- Pagination buttons -->
          </div>
        </div>
      </div>
    </main>

    <!-- Add/Edit Expense Modal -->
    <div class="modal fade" id="expenseModal" tabindex="-1" aria-labelledby="expenseModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content sw-modal">
          <div class="modal-header sw-modal-head">
            <h2 class="modal-title h5 mb-0" id="expenseModalTitle">Add Expense</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="expenseForm">
            <div class="modal-body sw-modal-body">
              <div id="formAlert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

              <div class="mb-3">
                <label for="formTitle" class="form-label">Expense Title *</label>
                <input type="text" class="form-control" id="formTitle" placeholder="e.g. Grocery shopping" required maxlength="120" />
              </div>

              <div class="row g-2 mb-3">
                <div class="col-sm-6">
                  <label for="formAmount" class="form-label">Amount (INR) *</label>
                  <input type="number" step="0.01" min="0.01" class="form-control" id="formAmount" placeholder="0.00" required />
                </div>
                <div class="col-sm-6">
                  <label for="formDate" class="form-label">Expense Date *</label>
                  <input type="date" class="form-control" id="formDate" required />
                </div>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-sm-6">
                  <label for="formCategory" class="form-label">Category *</label>
                  <select class="form-select" id="formCategory" required>
                    <option value="" disabled selected>Select category</option>
                  </select>
                </div>
                <div class="col-sm-6">
                  <label for="formPaymentMethod" class="form-label">Payment Method *</label>
                  <select class="form-select" id="formPaymentMethod" required>
                    <option value="UPI">UPI</option>
                    <option value="Cash">Cash</option>
                    <option value="Debit Card">Debit Card</option>
                    <option value="Credit Card">Credit Card</option>
                    <option value="Bank Transfer">Bank Transfer</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
              </div>

              <div class="mb-3">
                <label for="formNotes" class="form-label">Notes (Optional)</label>
                <textarea class="form-control" id="formNotes" rows="2" placeholder="Optional details or tags…" maxlength="500"></textarea>
              </div>
            </div>
            <div class="modal-footer sw-modal-foot">
              <button type="button" class="btn btn-outline-sw" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary" id="saveExpenseBtn">Save Expense</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content sw-modal sm">
          <div class="modal-header sw-modal-head border-0 pb-0">
            <h2 class="modal-title h6 text-danger mb-0">Delete Expense?</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body sw-modal-body py-3">
            <p class="small text-muted mb-0">
              Are you sure you want to delete "<strong id="deleteExpenseTitle"></strong>"? This action cannot be undone.
            </p>
          </div>
          <div class="modal-footer sw-modal-foot border-0 pt-0">
            <button type="button" class="btn btn-outline-sw btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger btn-sm" id="confirmDeleteBtn">Delete</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Global Toast Notifications -->
    <div id="toastStack" class="toast-stack"></div>

    <!-- Vendor Scripts -->
    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../vendor/lucide.js"></script>

    <!-- Page Module -->
    <script type="module">
      import { initExpenses } from '../js/pages/expenses.js';
      document.addEventListener('DOMContentLoaded', () => {
        initExpenses();
      });
    </script>
  </body>
</html>
